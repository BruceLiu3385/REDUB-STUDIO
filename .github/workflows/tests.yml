name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/redub_studio/requirements.txt
      - name: Install media tools and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r requirements-dev.txt
      - name: Check source syntax
        run: |
          python -m compileall -q apps deploy tools tests
          find deploy -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
          node --check apps/redub_studio/redub_studio/static/app.js
      - name: Run CPU API and media tests
        run: python -m pytest
